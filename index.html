<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mateo · GPS Performance Dashboard v4</title>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/recharts@2.5.0/umd/Recharts.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #060a0f; font-family: 'Syne', sans-serif; color: #c9d6e3; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #060a0f; }
    ::-webkit-scrollbar-thumb { background: #1a2d44; border-radius: 2px; }
    input[type=range] { accent-color: #00e5ff; width: 100%; }
    input[type=date], input[type=number], select {
      background: #060a0f; border: 1px solid #1a2d44; border-radius: 5px;
      color: #c9d6e3; padding: 7px 11px; font-size: 12px; font-family: 'Space Mono', monospace;
      width: 100%; outline: none; transition: border-color .2s;
    }
    input:focus, select:focus { border-color: #00e5ff; }
    table { border-collapse: collapse; width: 100%; }
    th { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #3d5a73; padding: 8px 10px; text-align: left; border-bottom: 1px solid #0f1e2e; }
    td { padding: 8px 10px; font-family: 'Space Mono', monospace; font-size: 11px; border-bottom: 1px solid #0a1520; }
    tr:hover td { background: #0a1520; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip,
        Legend, ResponsiveContainer, ReferenceLine, Cell, ComposedChart, Area } = Recharts;

const C = {
  bg: "#060a0f", panel: "#0b1520", panel2: "#0f1e2e",
  border: "#1a2d44", accent: "#00e5ff", green: "#22d47a",
  amber: "#f5a623", red: "#f04040", purple: "#a855f7",
  text: "#c9d6e3", dim: "#3d5a73", muted: "#1e3349",
  orange: "#ff6b35"
};

const TOOLTIP = {
  contentStyle: { background: "#0b1520", border: "1px solid #1a2d44", borderRadius: 8, color: "#c9d6e3", fontSize: 11, fontFamily: "'Space Mono', monospace" },
  itemStyle: { color: "#c9d6e3" },
  labelStyle: { color: "#00e5ff", fontWeight: 700 }
};
const MATCH_TT = { ...TOOLTIP, labelFormatter: (label, payload) => {
  const d = payload?.[0]?.payload;
  return d?.opponent ? `${label} — ${d.opponent}` : label;
}};

const TIER_MDI = { "1": 1.0, "2": 0.82, "3": 0.65, "4": 0.50 };
// Calibrado con promedios reales de Mateo (10 partidos, Apr 2026). Recalibrar cada ~10 partidos.
const EXPECTED_HID_PER_MIN = { "1": 17.0, "2": 15.0, "3": 13.0, "4": 12.0 };

const TIER_TEXT_MAP = {
  "elite": "1", "t1": "1", "1": "1",
  "strong": "2", "t2": "2", "2": "2",
  "medium": "3", "t3": "3", "3": "3",
  "low": "4", "very low": "4", "t4": "4", "4": "4"
};
function getTierKey(tier) {
  if (!tier) return "2";
  const key = String(tier).trim().toLowerCase();
  return TIER_TEXT_MAP[key] || String(tier).replace(/[^0-9]/g, "") || "2";
}
function getMDI(tier) { return TIER_MDI[getTierKey(tier)] ?? 0.75; }
function getExpectedHID(tier, mins) {
  const rate = EXPECTED_HID_PER_MIN[getTierKey(tier)] ?? 7.0;
  return mins > 0 ? +(rate * mins).toFixed(0) : null;
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
  return lines.slice(1).map(line => {
    const cols = []; let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ""; }
      else { cur += ch; }
    }
    cols.push(cur);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cols[i] || "").trim().replace(/^"|"$/g, ""); });
    return obj;
  });
}

function parseDate(raw) {
  if (!raw) return null;
  const d = new Date(raw);
  return isNaN(d) ? null : d;
}

function formatDate(raw) {
  const d = parseDate(raw);
  if (!d) return raw || "";
  return d.toLocaleDateString("es-MX", { month: "short", day: "numeric" });
}

function rowToMatch(row) {
  const mins = parseFloat(row["Minutes Played"]) || 0;
  const dist = parseFloat(row["Total Distance (m)"]) || 0;
  const intensity = parseFloat(row["Intensity (m/min)"]) || 0;
  const hid = parseFloat(row["HID (m)"]) || 0;
  const hidMin = mins > 0 && hid > 0 ? parseFloat((hid / mins).toFixed(2)) : 0;
  const workRate = parseFloat(row["Work Rate (%)"]) || 0;
  const rpeRaw = parseFloat(row["RPE (1-10)"]);
  const rpe = !isNaN(rpeRaw) && rpeRaw > 0 ? rpeRaw : (workRate > 0 ? Math.min(10, Math.round(workRate / 10)) : 6);
  const load = Math.round(mins * rpe);
  const tier = row["Opponent Tier"] || "2";
  const mdi = getMDI(tier);
  const expHID = getExpectedHID(tier, mins);
  const loadRatio = expHID > 0 ? parseFloat((hid / expHID).toFixed(2)) : null;
  const rawDate = row["Date"] || "";
  const dateObj = parseDate(rawDate);
  const z1 = parseFloat(row["Z1"] || row["HR Z1"] || 0);
  const z2 = parseFloat(row["Z2"] || row["HR Z2"] || 0);
  const z3 = parseFloat(row["Z3"] || row["HR Z3"] || 0);
  const z4 = parseFloat(row["Z4"] || row["HR Z4"] || 0);
  const z5 = parseFloat(row["Z5"] || row["HR Z5"] || 0);
  return {
    rawDate, dateObj, date: formatDate(rawDate),
    opponent: row["Opponent"] || "", tier, mdi,
    mins, pos: row["Position"] || "", result: row["Result"] || "",
    goals: parseFloat(row["Goals"]) || 0, assists: parseFloat(row["Assists"]) || 0,
    workRate, totalDist: dist, intensity, hid, hidMin,
    sprintDist: parseFloat(row["Sprint Distance (m)"]) || 0,
    hsr: parseFloat(row["HSR (m)"]) || 0,
    rpe, load, expHID, loadRatio,
    z1, z2, z3, z4, z5,
    maxHR: parseFloat(row["Max HR"] || row["Max HR (bpm)"] || 0),
    avgHR: parseFloat(row["Avg HR"] || row["Avg HR (bpm)"] || 0),
    redZone: parseFloat(row["Time in Red Zone"] || row["Red Zone (min)"] || 0),
    accel: parseFloat(row["Accelerations"] || row["Accels"] || 0),
    decel: parseFloat(row["Decelerations"] || row["Decels"] || 0),
  };
}

// ACWR: fecha real — ventana deslizante de 7d aguda / 28d crónica
function computeACWR(sessions) {
  return sessions.map((s) => {
    const refDate = s.dateObj || new Date();
    const msDay = 86400000;
    const acute = sessions.filter(x => {
      if (!x.dateObj) return false;
      const diff = (refDate - x.dateObj) / msDay;
      return diff >= 0 && diff < 7;
    });
    const chronic = sessions.filter(x => {
      if (!x.dateObj) return false;
      const diff = (refDate - x.dateObj) / msDay;
      return diff >= 0 && diff < 28;
    });
    const acuteAvg = acute.length ? acute.reduce((a, x) => a + x.load, 0) / 7 : 0;
    const chronicAvg = chronic.length ? chronic.reduce((a, x) => a + x.load, 0) / 28 : 0;
    const acwr = chronicAvg > 0 ? parseFloat((acuteAvg / chronicAvg).toFixed(2)) : null;
    return { ...s, acwr, acuteLoad: Math.round(acuteAvg * 7), chronicLoad: Math.round(chronicAvg * 28) };
  });
}

function acwrColor(v) {
  if (v == null) return C.dim;
  if (v < 0.8) return C.amber;
  if (v <= 1.3) return C.green;
  if (v <= 1.5) return C.amber;
  return C.red;
}
function acwrLabel(v) {
  if (v == null) return "—";
  if (v < 0.8) return "Underload";
  if (v <= 1.3) return "Óptimo";
  if (v <= 1.5) return "Precaución";
  return "OVERLOAD";
}
function loadRatioColor(v) {
  if (v == null) return C.dim;
  if (v < 0.75) return C.purple;
  if (v <= 1.15) return C.green;
  if (v <= 1.35) return C.amber;
  return C.red;
}
function loadRatioLabel(v) {
  if (v == null) return "—";
  if (v < 0.75) return "Bajo";
  if (v <= 1.15) return "Óptimo";
  if (v <= 1.35) return "Alto";
  return "EXCESO";
}

function KPI({ label, value, unit, color = C.accent, sub }) {
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: "14px 16px", flex: 1, minWidth: 110 }}>
      <p style={{ color: C.dim, fontSize: 8, letterSpacing: 2.5, textTransform: "uppercase", fontFamily: "'Space Mono', monospace", marginBottom: 6 }}>{label}</p>
      <p style={{ color, fontSize: 22, fontWeight: 800, lineHeight: 1, fontFamily: "'Syne', sans-serif" }}>
        {value != null ? value : "—"}
        <span style={{ fontSize: 10, color: C.dim, marginLeft: 3, fontWeight: 400 }}>{unit}</span>
      </p>
      {sub && <p style={{ color: C.dim, fontSize: 9, marginTop: 5, fontFamily: "'Space Mono', monospace" }}>{sub}</p>}
    </div>
  );
}

function ST({ children }) {
  return (
    <div style={{ borderBottom: `1px solid ${C.border}`, paddingBottom: 8, marginBottom: 14, marginTop: 28 }}>
      <h3 style={{ color: C.dim, fontSize: 8, letterSpacing: 3, textTransform: "uppercase", fontFamily: "'Space Mono', monospace" }}>{children}</h3>
    </div>
  );
}

function Badge({ color, label }) {
  return <span style={{ background: color + "22", border: `1px solid ${color}44`, borderRadius: 4, padding: "2px 8px", color, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 1 }}>{label}</span>;
}

function AlertBar({ acwr, loadRatio }) {
  const alerts = [];
  if (acwr > 1.5) alerts.push({ color: C.red, text: `ACWR ${acwr} — Riesgo alto de lesión. Reducir carga inmediatamente.` });
  else if (acwr > 1.3) alerts.push({ color: C.amber, text: `ACWR ${acwr} — Zona precaución. Monitorear recuperación.` });
  else if (acwr != null && acwr < 0.8) alerts.push({ color: C.amber, text: `ACWR ${acwr} — Underload. Riesgo de desentrenamiento.` });
  if (loadRatio > 1.35) alerts.push({ color: C.red, text: `Load Ratio ${loadRatio} — HID excede expected para este rival. Revisar gestión de carga.` });
  if (!alerts.length) return null;
  return (
    <div style={{ marginBottom: 16 }}>
      {alerts.map((a, i) => (
        <div key={i} style={{ background: a.color + "15", border: `1px solid ${a.color}55`, borderRadius: 8, padding: "10px 16px", marginBottom: 6, display: "flex", gap: 10, alignItems: "center" }}>
          <span style={{ color: a.color, fontSize: 16 }}>⚠</span>
          <span style={{ color: a.color, fontFamily: "'Space Mono', monospace", fontSize: 11 }}>{a.text}</span>
        </div>
      ))}
    </div>
  );
}

function MatchesTab({ matches }) {
  if (!matches?.length) return (
    <div style={{ textAlign: "center", padding: "80px 0", color: C.dim, fontFamily: "'Space Mono', monospace", fontSize: 12 }}>
      Cargando datos desde Google Sheets...<br /><span style={{ color: C.accent }}>Un momento</span>
    </div>
  );

  const avg = key => {
    const v = matches.map(m => m[key]).filter(x => x != null && x > 0);
    return v.length ? +(v.reduce((a, b) => a + b, 0) / v.length).toFixed(2) : null;
  };

  const withACWR = useMemo(() => computeACWR(matches), [matches]);
  const latest = withACWR[withACWR.length - 1];
  const hasHR = matches.some(m => m.z1 > 0 || m.z2 > 0);
  const hasAccel = matches.some(m => m.accel > 0 || m.decel > 0);

  const lrData = withACWR.map(m => ({ date: m.date, actual: m.hid, expected: m.expHID, ratio: m.loadRatio }));

  return (
    <div>
      <AlertBar acwr={latest?.acwr} loadRatio={latest?.loadRatio} />
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
        <KPI label="Partidos" value={matches.length} color={C.accent} />
        <KPI label="HID/min avg" value={avg("hidMin")} unit="m/min" color={C.orange} />
        <KPI label="Intensidad avg" value={avg("intensity")} unit="m/min" color={C.accent} />
        <KPI label="ACWR (último)" value={latest?.acwr} color={acwrColor(latest?.acwr)} sub={acwrLabel(latest?.acwr)} />
        <KPI label="Load Ratio (últ)" value={latest?.loadRatio} color={loadRatioColor(latest?.loadRatio)} sub={loadRatioLabel(latest?.loadRatio)} />
      </div>

      <ST>ACWR — ACUTE:CHRONIC WORKLOAD RATIO (cálculo por fecha real)</ST>
      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        <Badge color={C.amber} label="Underload &lt;0.8" />
        <Badge color={C.green} label="Óptimo 0.8–1.3" />
        <Badge color={C.amber} label="Precaución 1.3–1.5" />
        <Badge color={C.red} label="Overload &gt;1.5" />
      </div>
      <ResponsiveContainer width="100%" height={200}>
        <ComposedChart data={withACWR} margin={{ top: 4, right: 16, bottom: 0, left: -10 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
          <XAxis dataKey="date" tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono'" }} />
          <YAxis domain={[0, 2.2]} tick={{ fill: C.dim, fontSize: 9 }} />
          <Tooltip {...MATCH_TT} />
          <ReferenceLine y={1.5} stroke={C.red} strokeDasharray="4 2" />
          <ReferenceLine y={0.8} stroke={C.amber} strokeDasharray="4 2" />
          <Area dataKey="acwr" name="ACWR" fill={C.accent + "18"} stroke={C.accent} strokeWidth={2.5} dot={{ r: 4, fill: C.accent }} />
        </ComposedChart>
      </ResponsiveContainer>

      <ST>HID ACTUAL vs EXPECTED HID — por tier del rival</ST>
      <p style={{ color: C.dim, fontSize: 10, fontFamily: "'Space Mono', monospace", marginBottom: 12 }}>
        Expected = mins × HID/min (Mateo avg) · T1 Elite: 17.0 · T2 Strong: 15.0 · T3 Medium: 13.0 · T4 Low: 12.0 m/min
      </p>
      <ResponsiveContainer width="100%" height={200}>
        <ComposedChart data={lrData} margin={{ top: 4, right: 16, bottom: 0, left: -10 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
          <XAxis dataKey="date" tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono'" }} />
          <YAxis tick={{ fill: C.dim, fontSize: 9 }} />
          <Tooltip {...MATCH_TT} />
          <Legend wrapperStyle={{ fontSize: 10, color: C.dim, fontFamily: "'Space Mono'" }} />
          <Bar dataKey="expected" name="Expected HID" fill={C.muted} radius={[3, 3, 0, 0]} />
          <Bar dataKey="actual" name="HID Real" radius={[3, 3, 0, 0]}>
            {lrData.map((d, i) => <Cell key={i} fill={loadRatioColor(d.ratio)} />)}
          </Bar>
        </ComposedChart>
      </ResponsiveContainer>

      <div style={{ marginTop: 10 }}>
        <p style={{ color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace", marginBottom: 8 }}>LOAD RATIO — HID Real / HID Expected</p>
        <ResponsiveContainer width="100%" height={120}>
          <LineChart data={lrData} margin={{ top: 4, right: 16, bottom: 0, left: -10 }}>
            <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
            <XAxis dataKey="date" tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono'" }} />
            <YAxis domain={[0, 2]} tick={{ fill: C.dim, fontSize: 9 }} />
            <Tooltip {...MATCH_TT} />
            <ReferenceLine y={1.35} stroke={C.red} strokeDasharray="4 2" />
            <ReferenceLine y={0.75} stroke={C.purple} strokeDasharray="4 2" />
            <Line dataKey="ratio" name="Load Ratio" stroke={C.orange} strokeWidth={2} dot={{ r: 4, fill: C.orange }} />
          </LineChart>
        </ResponsiveContainer>
      </div>

      <ST>HID/min vs INTENSIDAD — perfil de carga competitiva</ST>
      <ResponsiveContainer width="100%" height={200}>
        <LineChart data={matches} margin={{ top: 4, right: 16, bottom: 0, left: -10 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
          <XAxis dataKey="date" tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono'" }} />
          <YAxis tick={{ fill: C.dim, fontSize: 9 }} />
          <Tooltip {...MATCH_TT} />
          <Legend wrapperStyle={{ fontSize: 10, color: C.dim, fontFamily: "'Space Mono'" }} />
          <Line dataKey="hidMin" name="HID/min" stroke={C.orange} strokeWidth={2.5} dot={{ r: 4 }} />
          <Line dataKey="intensity" name="Intensidad (m/min)" stroke={C.accent} strokeWidth={2} strokeDasharray="5 3" dot={{ r: 3 }} />
        </LineChart>
      </ResponsiveContainer>

      {hasHR && (
        <>
          <ST>ZONAS DE FRECUENCIA CARDÍACA</ST>
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={matches.filter(m => m.z1 + m.z2 + m.z3 + m.z4 + m.z5 > 0)} margin={{ top: 4, right: 16, bottom: 0, left: -10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
              <XAxis dataKey="date" tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono'" }} />
              <YAxis tick={{ fill: C.dim, fontSize: 9 }} />
              <Tooltip {...MATCH_TT} />
              <Legend wrapperStyle={{ fontSize: 10, color: C.dim, fontFamily: "'Space Mono'" }} />
              <Bar dataKey="z1" name="Z1" stackId="hr" fill="#1e3349" />
              <Bar dataKey="z2" name="Z2" stackId="hr" fill="#2d5a7a" />
              <Bar dataKey="z3" name="Z3" stackId="hr" fill={C.amber} />
              <Bar dataKey="z4" name="Z4" stackId="hr" fill={C.orange} />
              <Bar dataKey="z5" name="Z5" stackId="hr" fill={C.red} />
            </BarChart>
          </ResponsiveContainer>
        </>
      )}

      {hasAccel && (
        <>
          <ST>ACELERACIONES vs DESACELERACIONES — carga neuromuscular</ST>
          <p style={{ color: C.dim, fontSize: 10, fontFamily: "'Space Mono', monospace", marginBottom: 10 }}>
            Decel &gt; Accel en patrón sostenido = riesgo posterior (isquios). Monitorear.
          </p>
          <ResponsiveContainer width="100%" height={180}>
            <BarChart data={matches} margin={{ top: 4, right: 16, bottom: 0, left: -10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
              <XAxis dataKey="date" tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono'" }} />
              <YAxis tick={{ fill: C.dim, fontSize: 9 }} />
              <Tooltip {...MATCH_TT} />
              <Legend wrapperStyle={{ fontSize: 10, color: C.dim, fontFamily: "'Space Mono'" }} />
              <Bar dataKey="accel" name="Aceleraciones" fill={C.green} radius={[3, 3, 0, 0]} />
              <Bar dataKey="decel" name="Desaceleraciones" fill={C.red} radius={[3, 3, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </>
      )}

      <ST>LOG DE PARTIDOS</ST>
      <div style={{ overflowX: "auto" }}>
        <table>
          <thead>
            <tr>{["Fecha","Rival","T","MDI","Min","Result","G","A","Dist","Intens","HID","HID/min","xHID","Load Ratio","Work%","ACWR"].map(h => <th key={h}>{h}</th>)}</tr>
          </thead>
          <tbody>
            {withACWR.map((m, i) => {
              const lrC = loadRatioColor(m.loadRatio);
              const aw = acwrColor(m.acwr);
              const rc = m.result?.charAt(0) === "W" ? C.green : m.result?.charAt(0) === "D" ? C.amber : C.red;
              return (
                <tr key={i}>
                  <td style={{ color: C.accent }}>{m.date}</td>
                  <td style={{ color: C.text, whiteSpace: "nowrap" }}>{m.opponent}</td>
                  <td style={{ color: C.dim }}>{m.tier}</td>
                  <td style={{ color: C.text }}>{m.mdi?.toFixed(2)}</td>
                  <td style={{ color: C.text }}>{m.mins}</td>
                  <td style={{ color: rc, fontWeight: 700 }}>{m.result}</td>
                  <td style={{ color: C.text }}>{m.goals}</td>
                  <td style={{ color: C.text }}>{m.assists}</td>
                  <td style={{ color: C.text }}>{m.totalDist?.toLocaleString()}</td>
                  <td style={{ color: C.accent }}>{m.intensity}</td>
                  <td style={{ color: C.text }}>{m.hid}</td>
                  <td style={{ color: C.orange }}>{m.hidMin}</td>
                  <td style={{ color: C.dim }}>{m.expHID ?? "—"}</td>
                  <td style={{ color: lrC, fontWeight: 700 }}>{m.loadRatio ?? "—"}</td>
                  <td style={{ color: m.workRate > 80 ? C.red : m.workRate > 60 ? C.amber : C.green }}>{m.workRate ? m.workRate + "%" : "—"}</td>
                  <td style={{ color: aw, fontWeight: 700 }}>{m.acwr ?? "—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const TRAINING_KEY = "mfc_training_v4";
const SEED = [
  { date: "Mar 31", dateObj: new Date("2026-03-31"), rawDate: "2026-03-31", type: "Training", mins: 89, totalDist: 4201, intensity: 79, hid: 366, hidMin: 4.11, sprints: 4, maxSpeed: 6.01, rpe: 6, load: 534, z1: 11, z2: 29, z3: 29, z4: 16, z5: 4 },
  { date: "Abr 1", dateObj: new Date("2026-04-01"), rawDate: "2026-04-01", type: "Training", mins: 91, totalDist: 6639, intensity: 73, hid: 1163, hidMin: 13.0, sprints: 21, maxSpeed: 7.75, rpe: 8, load: 728, z1: 23, z2: 18, z3: 25, z4: 17, z5: 8 },
  { date: "Abr 7", dateObj: new Date("2026-04-07"), rawDate: "2026-04-07", type: "Training", mins: 82, totalDist: 3536, intensity: 43, hid: 339, hidMin: 4.13, sprints: 5, maxSpeed: 6.23, rpe: 6.5, load: 533, z1: 22, z2: 30, z3: 17, z4: 10, z5: 4 },

function TrainingForm({ onAdd }) {
  const [f, setF] = useState({ date: "", mins: 70, totalDist: "", intensity: "", hid: "", sprints: "", maxSpeed: "", rpe: 6 });
  const [open, setOpen] = useState(false);
  const field = (key, lbl, type = "number", step = "1") => (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <label style={{ color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 1 }}>{lbl}</label>
      <input type={type} step={step} value={f[key]} onChange={e => setF(p => ({ ...p, [key]: e.target.value }))} />
    </div>
  );
  const submit = () => {
    if (!f.date || !f.totalDist) return;
    const rpe = parseInt(f.rpe), mins = parseFloat(f.mins), hid = parseFloat(f.hid) || 0;
    const load = Math.round(mins * rpe);
    const rawDate = f.date, dateObj = parseDate(rawDate);
    onAdd({ ...f, type: "Training", rawDate, dateObj, date: formatDate(rawDate), mins, totalDist: parseFloat(f.totalDist), intensity: parseFloat(f.intensity) || 0, hid, hidMin: hid && mins ? parseFloat((hid / mins).toFixed(2)) : null, sprints: parseFloat(f.sprints) || 0, maxSpeed: parseFloat(f.maxSpeed) || 0, rpe, load });
    setF({ date: "", mins: 70, totalDist: "", intensity: "", hid: "", sprints: "", maxSpeed: "", rpe: 6 });
    setOpen(false);
  };
  return (
    <div style={{ marginBottom: 20 }}>
      <button onClick={() => setOpen(o => !o)} style={{ background: open ? "transparent" : C.accent, color: open ? C.dim : "#000", border: `1px solid ${open ? C.border : C.accent}`, borderRadius: 7, padding: "8px 18px", fontFamily: "'Space Mono', monospace", fontSize: 11, cursor: "pointer" }}>
        {open ? "✕ Cancelar" : "+ Registrar sesión"}
      </button>
      {open && (
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 20, marginTop: 12 }}>
          <p style={{ color: C.accent, fontFamily: "'Space Mono', monospace", fontSize: 10, marginBottom: 14, letterSpacing: 2 }}>NUEVA SESIÓN</p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(130px, 1fr))", gap: 12 }}>
            {field("date", "Fecha", "date")}
            {field("mins", "Minutos")}
            {field("totalDist", "Dist total (m)")}
            {field("intensity", "Intensidad (m/min)")}
            {field("hid", "HID (m)")}
            {field("sprints", "Sprints (#)")}
            {field("maxSpeed", "Max Speed (m/s)", "number", "0.01")}
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <label style={{ color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 1 }}>RPE (1–10)</label>
              <input type="range" min={1} max={10} value={f.rpe} onChange={e => setF(p => ({ ...p, rpe: e.target.value }))} />
              <span style={{ color: C.accent, fontFamily: "'Space Mono', monospace", fontSize: 13, fontWeight: 700 }}>{f.rpe} / 10</span>
            </div>
          </div>
          <button onClick={submit} style={{ marginTop: 16, background: C.green, color: "#000", border: "none", borderRadius: 8, padding: "9px 24px", fontFamily: "'Space Mono', monospace", fontSize: 11, cursor: "pointer", fontWeight: 700 }}>Guardar sesión</button>
        </div>
      )}
    </div>
  );
}

function TrainingTab({ sessions, onAdd }) {
  const withACWR = useMemo(() => computeACWR(sessions), [sessions]);
  const latest = withACWR[withACWR.length - 1];
  const avg = arr => arr.filter(Boolean).length ? +(arr.filter(Boolean).reduce((a, b) => a + b, 0) / arr.filter(Boolean).length).toFixed(2) : null;
  const totalLoad = sessions.reduce((a, s) => a + s.load, 0);
  if (!sessions.length) return <div><TrainingForm onAdd={onAdd} /><div style={{ textAlign: "center", padding: "60px 0", color: C.dim, fontFamily: "'Space Mono', monospace", fontSize: 12 }}>No hay sesiones.<br /><span style={{ color: C.accent }}>Registra la primera sesión arriba</span></div></div>;
  return (
    <div>
      <TrainingForm onAdd={onAdd} />
      <AlertBar acwr={latest?.acwr} />
      {latest?.acwr && (
        <div style={{ background: C.panel, border: `2px solid ${acwrColor(latest.acwr)}`, borderRadius: 12, padding: "14px 20px", display: "flex", alignItems: "center", gap: 16, marginBottom: 20 }}>
          <div style={{ width: 44, height: 44, borderRadius: "50%", background: acwrColor(latest.acwr) + "22", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <span style={{ color: acwrColor(latest.acwr), fontSize: 20, fontWeight: 900 }}>{latest.acwr > 1.5 ? "!" : latest.acwr < 0.8 ? "↓" : "✓"}</span>
          </div>
          <div>
            <p style={{ color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 2 }}>ACWR ACTUAL</p>
            <p style={{ color: acwrColor(latest.acwr), fontSize: 28, fontWeight: 900, fontFamily: "'Syne', sans-serif" }}>{latest.acwr} <span style={{ fontSize: 13, fontWeight: 400 }}>{acwrLabel(latest.acwr)}</span></p>
            <p style={{ color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace", marginTop: 4 }}>Carga aguda 7d: {latest.acuteLoad} UA · Crónica 28d: {latest.chronicLoad} UA</p>
          </div>
        </div>
      )}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
        <KPI label="Sesiones" value={sessions.length} color={C.accent} />
        <KPI label="Max Speed avg" value={avg(sessions.map(s => s.maxSpeed))} unit="m/s" color={C.green} />
        <KPI label="HID avg" value={avg(sessions.map(s => s.hid))} unit="m" color={C.orange} />
        <KPI label="Carga total" value={totalLoad} unit="UA" color={C.amber} sub="RPE × min" />
      </div>
      <ST>ACWR — TRAINING (fecha real)</ST>
      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        <Badge color={C.amber} label="Underload" /><Badge color={C.green} label="Óptimo" /><Badge color={C.amber} label="Precaución" /><Badge color={C.red} label="Overload" />
      </div>
      <ResponsiveContainer width="100%" height={200}>
        <ComposedChart data={withACWR} margin={{ top: 4, right: 16, bottom: 0, left: -10 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
          <XAxis dataKey="date" tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono'" }} />
          <YAxis domain={[0, 2.2]} tick={{ fill: C.dim, fontSize: 9 }} />
          <Tooltip {...TOOLTIP} />
          <ReferenceLine y={1.5} stroke={C.red} strokeDasharray="4 2" />
          <ReferenceLine y={0.8} stroke={C.amber} strokeDasharray="4 2" />
          <Area dataKey="acwr" name="ACWR" fill={C.accent + "18"} stroke={C.accent} strokeWidth={2.5} dot={{ r: 4, fill: C.accent }} />
        </ComposedChart>
      </ResponsiveContainer>
      <ST>CARGA POR SESIÓN (RPE × min)</ST>
      <ResponsiveContainer width="100%" height={180}>
        <BarChart data={withACWR} margin={{ top: 4, right: 16, bottom: 0, left: -10 }}>
          <CartesianGrid strokeDasharray="3 3" stroke={C.border} />
          <XAxis dataKey="date" tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono'" }} />
          <YAxis tick={{ fill: C.dim, fontSize: 9 }} />
          <Tooltip {...TOOLTIP} />
          <Bar dataKey="load" name="Carga (UA)" radius={[4, 4, 0, 0]}>{withACWR.map((s, i) => <Cell key={i} fill={acwrColor(s.acwr)} />)}</Bar>
        </BarChart>
      </ResponsiveContainer>
      <ST>LOG DE SESIONES</ST>
      <div style={{ overflowX: "auto" }}>
        <table>
          <thead><tr>{["Fecha","Min","Dist","HID","HID/min","Sprints","Max Spd","RPE","Carga","ACWR","Estado"].map(h => <th key={h}>{h}</th>)}</tr></thead>
          <tbody>
            {withACWR.map((s, i) => {
              const col = acwrColor(s.acwr);
              return (
                <tr key={i}>
                  <td style={{ color: C.accent }}>{s.date}</td>
                  <td style={{ color: C.text }}>{s.mins}</td>
                  <td style={{ color: C.text }}>{s.totalDist}</td>
                  <td style={{ color: C.orange }}>{s.hid}</td>
                  <td style={{ color: C.orange }}>{s.hidMin}</td>
                  <td style={{ color: C.text }}>{s.sprints}</td>
                  <td style={{ color: C.green }}>{s.maxSpeed}</td>
                  <td style={{ color: C.text }}>{s.rpe}</td>
                  <td style={{ color: C.amber }}>{s.load}</td>
                  <td style={{ color: col, fontWeight: 700 }}>{s.acwr ?? "—"}</td>
                  <td style={{ color: col }}>{acwrLabel(s.acwr)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Dashboard() {
  const [tab, setTab] = useState("matches");
  const [matches, setMatches] = useState([]);
  const [training, setTraining] = useState([]);
  const [status, setStatus] = useState("loading");

  useEffect(() => {
    try {
      const stored = localStorage.getItem(TRAINING_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        setTraining(parsed.map(s => ({ ...s, dateObj: s.rawDate ? new Date(s.rawDate) : null })));
      } else {
        setTraining(SEED);
        localStorage.setItem(TRAINING_KEY, JSON.stringify(SEED));
      }
    } catch { setTraining(SEED); }
  }, []);

  useEffect(() => {
    const url = "https://docs.google.com/spreadsheets/d/1lGBQlrUJt6Rv-YIqnBNHZ4MIHiwYgu_0vHqsC5J4ark/export?format=csv&gid=1971038813";
    fetch(url).then(r => r.text()).then(text => {
      const rows = parseCSV(text);
      const parsed = rows.filter(r => parseFloat(r["Total Distance (m)"]) > 0).map(rowToMatch);
      setMatches(parsed);
      setStatus("ok");
    }).catch(e => {
      console.warn("CSV fetch failed, using embedded match data:", e);
      setMatches(MATCH_SEED.map(rowToMatch));
      setStatus("fallback");
    });
  }, []);

  const addTraining = useCallback(s => {
    setTraining(prev => {
      const next = [...prev, s];
      try { localStorage.setItem(TRAINING_KEY, JSON.stringify(next)); } catch {}
      return next;
    });
  }, []);

  const tabBtn = (id, lbl) => (
    <button onClick={() => setTab(id)} style={{ background: tab === id ? C.accent : "transparent", color: tab === id ? "#000" : C.dim, border: `1px solid ${tab === id ? C.accent : C.border}`, borderRadius: 7, padding: "8px 22px", fontFamily: "'Space Mono', monospace", fontSize: 11, cursor: "pointer", fontWeight: tab === id ? 700 : 400 }}>{lbl}</button>
  );

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, padding: "28px 28px 60px", maxWidth: 1140, margin: "0 auto" }}>
      <div style={{ marginBottom: 28, borderBottom: `1px solid ${C.border}`, paddingBottom: 20 }}>
        <p style={{ color: C.accent, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 4, textTransform: "uppercase", marginBottom: 6 }}>MLS NEXT · CHULA VISTA FC · U14 SW · 2026</p>
        <h1 style={{ fontSize: 40, fontWeight: 800, letterSpacing: -1, lineHeight: 1, color: "#f1f5f9", fontFamily: "'Syne', sans-serif" }}>
          MATEO <span style={{ color: C.accent }}>GPS PERFORMANCE</span>
        </h1>
        <p style={{ color: C.dim, fontSize: 11, marginTop: 6, fontFamily: "'Space Mono', monospace" }}>#6 / #8 · StatSports GPS · v4.0 — ACWR fecha real · MDI · Load Ratio · U14 calibrated tiers</p>
      </div>
      {status === "fallback" && <div style={{ background: "#0a1a10", border: `1px solid ${C.amber}44`, borderRadius: 8, padding: "10px 16px", marginBottom: 16, color: C.amber, fontFamily: "'Space Mono', monospace", fontSize: 11 }}>Modo offline — datos embebidos (última sync). Para datos en vivo, el Sheet debe ser público.</div>}
      <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
        {tabBtn("matches", `Partidos (${matches.length})`)}
        {tabBtn("training", `Training (${training.length})`)}
      </div>
      {tab === "matches" && <MatchesTab matches={matches} />}
      {tab === "training" && <TrainingTab sessions={training} onAdd={addTraining} />}
      <p style={{ color: C.muted, fontSize: 9, fontFamily: "'Space Mono', monospace", textAlign: "center", marginTop: 50, letterSpacing: 2 }}>MATEO · CHULA VISTA FC · MLS NEXT U14 SW · 2026 · v4.0</p>
    </div>
  );
}
