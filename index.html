    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip,
        Legend, ResponsiveContainer, ReferenceLine, Cell, ComposedChart, Area } = Recharts;

const C = {
  bg: "#060a0f", panel: "#0b1520", panel2: "#0f1e2e",
  border: "#1a2d44", accent: "#00e5ff", green: "#22d47a",
  amber: "#f5a623", red: "#f04040", purple: "#a855f7",
  text: "#c9d6e3", dim: "#3d5a73", muted: "#1e3349",
  orange: "#ff6b35", blue: "#4aa3ff"
};

// ───── Google Sheets CSV export ────────────────────────────────────────────
const SHEET_ID = "1lGBQlrUJt6Rv-YIqnBNHZ4MIHiwYgu_0vHqsC5J4ark";
const MATCH_GID = "1971038813";
// WEEKPRACTICE_LOG gid — si está disponible, pull en vivo; si no, usa SEED.
// Para habilitar lectura en vivo: el Sheet debe estar publicado y la pestaña WEEKPRACTICE_LOG
// debe tener export CSV habilitado. Cambiar este valor cuando se conozca el gid real.
const TRAINING_GID = "2018907103"; // WEEKPRACTICE_LOG

// cache-buster: Google Sheets cachea agresivamente el CSV export (~5 min).
// Con &cb=timestamp forzamos fetch fresco en cada carga del dashboard.
const csvUrl = (gid) => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}&cb=${Date.now()}`;

const TOOLTIP = {
  contentStyle: { background: "#0b1520", border: "1px solid #1a2d44", borderRadius: 8, color: "#c9d6e3", fontSize: 11, fontFamily: "'Space Mono', monospace" },
  itemStyle: { color: "#c9d6e3" },
  labelStyle: { color: "#00e5ff", fontWeight: 700 }
};
const MATCH_TT = { ...TOOLTIP, labelFormatter: (label, payload) => {
  const d = payload?.[0]?.payload;
  return d?.opponent ? `${label} — ${d.opponent}` : label;
}};

const TIER_MDI = { "1": 1.0, "2": 0.82, "3": 0.65, "4": 0.50 };
// Calibrado con promedios reales de Mateo (10 partidos, Apr 2026). Recalibrar cada ~10 partidos.
const EXPECTED_HID_PER_MIN = { "1": 17.0, "2": 15.0, "3": 13.0, "4": 12.0 };

const TIER_TEXT_MAP = {
  "elite": "1", "t1": "1", "1": "1",
  "strong": "2", "t2": "2", "2": "2",
  "medium": "3", "t3": "3", "3": "3",
  "low": "4", "very low": "4", "t4": "4", "4": "4"
};
function getTierKey(tier) {
  if (!tier) return "2";
  const key = String(tier).trim().toLowerCase();
  return TIER_TEXT_MAP[key] || String(tier).replace(/[^0-9]/g, "") || "2";
}
function getMDI(tier) { return TIER_MDI[getTierKey(tier)] ?? 0.75; }
function getExpectedHID(tier, mins) {
  const rate = EXPECTED_HID_PER_MIN[getTierKey(tier)] ?? 7.0;
  return mins > 0 ? +(rate * mins).toFixed(0) : null;
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, ""));
  return lines.slice(1).map(line => {
    const cols = []; let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ""; }
      else { cur += ch; }
    }
    cols.push(cur);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cols[i] || "").trim().replace(/^"|"$/g, ""); });
    return obj;
  });
}

// Parser robusto — maneja ISO, US, europeo, español e inglés (corto/largo) sin TZ shift
// iOS Safari es estricto con new Date(string) — por eso NO dependemos del fallback.
function parseDate(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  if (!s) return null;

  // ISO YYYY-MM-DD (local midnight, evita shift UTC→local)
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s].*)?$/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);

  // US M/D/YYYY o M/D/YY
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) {
    let y = +m[3]; if (y < 100) y += 2000;
    return new Date(y, +m[1] - 1, +m[2]);
  }

  // Europeo DD-MM-YYYY
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);

  // Meses ES + EN (corto y largo). Keys en lowercase, sin acentos problemáticos.
  // "mar", "may", "sep", "oct", "nov" coinciden en ambos idiomas.
  const MESES = {
    // Español corto
    ene:0, feb:1, mar:2, abr:3, may:4, jun:5, jul:6, ago:7, sep:8, oct:9, nov:10, dic:11,
    // Español largo
    enero:0, febrero:1, marzo:2, abril:3, mayo:4, junio:5, julio:6, agosto:7,
    septiembre:8, octubre:9, noviembre:10, diciembre:11,
    // Inglés corto (los únicos nuevos vs ES: jan, apr, aug, sept, dec)
    jan:0, apr:3, aug:7, sept:8, dec:11,
    // Inglés largo
    january:0, february:1, march:2, april:3, june:5, july:6, august:7,
    september:8, october:9, november:10, december:11
  };

  // Acepta separador espacio O guion: "1 Apr", "31-mar", "16 de abril 2026", "7 Apr 2026"
  m = s.toLowerCase().match(/^(\d{1,2})[\s-]+(?:de[\s-]+)?([a-záéíóú]+)\.?(?:[\s,-]+(\d{2,4}))?$/);
  if (m && MESES[m[2]] !== undefined) {
    let y;
    if (m[3]) { y = +m[3]; if (y < 100) y += 2000; }
    else       { y = new Date().getFullYear(); }
    return new Date(y, MESES[m[2]], +m[1]);
  }

  // Formato inverso: "Apr 7", "Apr 7, 2026", "April 7 2026"
  m = s.toLowerCase().match(/^([a-záéíóú]+)\.?[\s-]+(\d{1,2})(?:[\s,-]+(\d{2,4}))?$/);
  if (m && MESES[m[1]] !== undefined) {
    let y;
    if (m[3]) { y = +m[3]; if (y < 100) y += 2000; }
    else       { y = new Date().getFullYear(); }
    return new Date(y, MESES[m[1]], +m[2]);
  }

  // Fallback último recurso (iOS Safari suele fallar aquí — por eso los regex de arriba deben cubrir todo)
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function formatDate(raw) {
  const d = parseDate(raw);
  if (!d) return raw || "";
  return d.toLocaleDateString("es-MX", { month: "short", day: "numeric" });
}

function daysBetween(a, b) {
  if (!a || !b) return null;
  return Math.round((b - a) / 86400000);
}

function rowToMatch(row) {
  const mins = parseFloat(row["Minutes Played"]) || 0;
  const dist = parseFloat(row["Total Distance (m)"]) || 0;
  const intensity = parseFloat(row["Intensity (m/min)"]) || 0;
  const hid = parseFloat(row["HID (m)"]) || 0;
  const hidMin = mins > 0 && hid > 0 ? parseFloat((hid / mins).toFixed(2)) : 0;
  const workRate = parseFloat(row["Work Rate (%)"]) || 0;
  const rpeRaw = parseFloat(row["RPE (1-10)"]);
  const rpe = !isNaN(rpeRaw) && rpeRaw > 0 ? rpeRaw : (workRate > 0 ? Math.min(10, Math.round(workRate / 10)) : 6);
  const load = Math.round(mins * rpe);
  const tier = row["Opponent Tier"] || "2";
  const mdi = getMDI(tier);
  const expHID = getExpectedHID(tier, mins);
  const loadRatio = expHID > 0 ? parseFloat((hid / expHID).toFixed(2)) : null;
  const rawDate = row["Date"] || "";
  const dateObj = parseDate(rawDate);
  const z1 = parseFloat(row["Z1"] || row["HR Z1"] || 0);
  const z2 = parseFloat(row["Z2"] || row["HR Z2"] || 0);
  const z3 = parseFloat(row["Z3"] || row["HR Z3"] || 0);
  const z4 = parseFloat(row["Z4"] || row["HR Z4"] || 0);
  const z5 = parseFloat(row["Z5"] || row["HR Z5"] || 0);
  return {
    source: "match",
    rawDate, dateObj, date: formatDate(rawDate),
    opponent: row["Opponent"] || "", tier, mdi,
    mins, pos: row["Position"] || "", result: row["Result"] || "",
    goals: parseFloat(row["Goals"]) || 0, assists: parseFloat(row["Assists"]) || 0,
    workRate, totalDist: dist, intensity, hid, hidMin,
    sprintDist: parseFloat(row["Sprint Distance (m)"]) || 0,
    hsr: parseFloat(row["HSR (m)"]) || 0,
    rpe, load, expHID, loadRatio,
    z1, z2, z3, z4, z5,
    maxHR: parseFloat(row["Max HR"] || row["Max HR (bpm)"] || 0),
    avgHR: parseFloat(row["Avg HR"] || row["Avg HR (bpm)"] || 0),
    redZone: parseFloat(row["Time in Red Zone"] || row["Red Zone (min)"] || 0),
    accel: parseFloat(row["Accelerations (#)"] || row["Accelerations"] || row["Accels"] || 0),
    decel: parseFloat(row["Decelerations (#)"] || row["Decelerations"] || row["Decels"] || 0),
  };
}

// Parser para WEEKPRACTICE_LOG — columnas A..X según skill MFC
function rowToTraining(row) {
  // Lookup case-insensitive para tolerar diferencias en headers del Sheet
  const lowerMap = {};
  Object.keys(row).forEach(k => { lowerMap[k.toLowerCase().trim()] = row[k]; });
  const pick = (...keys) => {
    for (const k of keys) {
      const v = row[k] ?? lowerMap[k.toLowerCase().trim()];
      if (v != null && String(v).trim() !== "") return v;
    }
    return "";
  };
  const rawDate = pick("Session Date", "Date", "Fecha");
  const dateObj = parseDate(rawDate);
  const mins = parseFloat(pick("Minutes", "Min", "Minutos")) || 0;
  const hid = parseFloat(pick("HID", "HID (m)")) || 0;
  const hidMin = parseFloat(pick("HID/min", "HID per min")) || (mins > 0 && hid > 0 ? +(hid / mins).toFixed(2) : 0);
  const totalDist = parseFloat(pick("Total Dist", "Total Distance (m)", "Total Distance")) || 0;
  const intensity = parseFloat(pick("Intensity", "Intensity (m/min)")) || 0;
  const hsr = parseFloat(pick("HSR", "HSR (m)")) || 0;
  const sprints = parseFloat(pick("Sprints", "Sprints (#)")) || 0;
  const accel = parseFloat(pick("Accel", "Accelerations", "Accelerations (#)")) || 0;
  const decel = parseFloat(pick("Decel", "Decelerations", "Decelerations (#)")) || 0;
  const maxSpeed = parseFloat(pick("Max Speed", "Max Speed (m/s)")) || 0;
  const rpeRaw = parseFloat(pick("RPE", "RPE (1-10)"));
  const rpe = !isNaN(rpeRaw) && rpeRaw > 0 ? rpeRaw : 6;
  const load = Math.round(mins * rpe);
  const avgHR = parseFloat(pick("Avg HR", "Avg HR (bpm)")) || 0;
  const maxHR = parseFloat(pick("Max HR", "Max HR (bpm)")) || 0;
  const z1 = parseFloat(pick("Z1", "HR Z1")) || 0;
  const z2 = parseFloat(pick("Z2", "HR Z2")) || 0;
  const z3 = parseFloat(pick("Z3", "HR Z3")) || 0;
  const z4 = parseFloat(pick("Z4", "HR Z4")) || 0;
  const z5 = parseFloat(pick("Z5", "HR Z5")) || 0;
  return {
    source: "training",
    type: pick("Type", "Session Type") || "Training",
    name: pick("Name", "Session Name") || "",
    rawDate, dateObj, date: formatDate(rawDate),
    mins, totalDist, intensity, hid, hidMin, hsr,
    sprints, accel, decel, maxSpeed,
    rpe, load, avgHR, maxHR,
    z1, z2, z3, z4, z5,
  };
}

// ACWR: fecha real — ventana deslizante de 7d aguda / 28d crónica
function computeACWR(sessions) {
  return sessions.map((s) => {
    const refDate = s.dateObj || new Date();
    const msDay = 86400000;
    const acute = sessions.filter(x => {
      if (!x.dateObj) return false;
      const diff = (refDate - x.dateObj) / msDay;
      return diff >= 0 && diff < 7;
    });
    const chronic = sessions.filter(x => {
      if (!x.dateObj) return false;
      const diff = (refDate - x.dateObj) / msDay;
      return diff >= 0 && diff < 28;
    });
    const acuteAvg = acute.length ? acute.reduce((a, x) => a + x.load, 0) / 7 : 0;
    const chronicAvg = chronic.length ? chronic.reduce((a, x) => a + x.load, 0) / 28 : 0;
    const acwr = chronicAvg > 0 ? parseFloat((acuteAvg / chronicAvg).toFixed(2)) : null;
    return { ...s, acwr, acuteLoad: Math.round(acuteAvg * 7), chronicLoad: Math.round(chronicAvg * 28) };
  });
}

function acwrColor(v) {
  if (v == null) return C.dim;
  if (v < 0.8) return C.amber;
  if (v <= 1.3) return C.green;
  if (v <= 1.5) return C.amber;
  return C.red;
}
function acwrLabel(v) {
  if (v == null) return "—";
  if (v < 0.8) return "Underload";
  if (v <= 1.3) return "Óptimo";
  if (v <= 1.5) return "Precaución";
  return "OVERLOAD";
}
function loadRatioColor(v) {
  if (v == null) return C.dim;
  if (v < 0.75) return C.purple;
  if (v <= 1.15) return C.green;
  if (v <= 1.35) return C.amber;
  return C.red;
}
function loadRatioLabel(v) {
  if (v == null) return "—";
  if (v < 0.75) return "Bajo";
  if (v <= 1.15) return "Óptimo";
  if (v <= 1.35) return "Alto";
  return "EXCESO";
}

function KPI({ label, value, unit, color = C.accent, sub }) {
  return (
    <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: "14px 16px", flex: 1, minWidth: 110 }}>
      <p style={{ color: C.dim, fontSize: 8, letterSpacing: 2.5, textTransform: "uppercase", fontFamily: "'Space Mono', monospace", marginBottom: 6 }}>{label}</p>
      <p style={{ color, fontSize: 22, fontWeight: 800, lineHeight: 1, fontFamily: "'Syne', sans-serif" }}>
        {value != null ? value : "—"}
        <span style={{ fontSize: 10, color: C.dim, marginLeft: 3, fontWeight: 400 }}>{unit}</span>
      </p>
      {sub && <p style={{ color: C.dim, fontSize: 9, marginTop: 5, fontFamily: "'Space Mono', monospace" }}>{sub}</p>}
    </div>
  );
}

function ST({ children }) {
  return (
    <div style={{ borderBottom: `1px solid ${C.border}`, paddingBottom: 8, marginBottom: 14, marginTop: 28 }}>
      <h3 style={{ color: C.dim, fontSize: 8, letterSpacing: 3, textTransform: "uppercase", fontFamily: "'Space Mono', monospace" }}>{children}</h3>
    </div>
  );
}

function Badge({ color, label }) {
  return <span style={{ background: color + "22", border: `1px solid ${color}44`, borderRadius: 4, padding: "2px 8px", color, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 1 }}>{label}</span>;
}

function AlertBar({ acwr, loadRatio, scope = "" }) {
  const alerts = [];
  const pre = scope ? `[${scope}] ` : "";
  if (acwr > 1.5) alerts.push({ color: C.red, text: `${pre}ACWR ${acwr} — Riesgo alto de lesión. Reducir carga inmediatamente.` });
  else if (acwr > 1.3) alerts.push({ color: C.amber, text: `${pre}ACWR ${acwr} — Zona precaución. Monitorear recuperación.` });
  else if (acwr != null && acwr < 0.8) alerts.push({ color: C.amber, text: `${pre}ACWR ${acwr} — Underload. Riesgo de desentrenamiento.` });
  if (loadRatio > 1.35) alerts.push({ color: C.red, text: `${pre}Load Ratio ${loadRatio} — HID excede expected para este rival.` });
  if (!alerts.length) return null;
  return (
    <div style={{ marginBottom: 16 }}>
      {alerts.map((a, i) => (
        <div key={i} style={{ background: a.color + "15", border: `1px solid ${a.color}55`, borderRadius: 8, padding: "10px 16px", marginBottom: 6, display: "flex", gap: 10, alignItems: "center" }}>
          <span style={{ color: a.color, fontSize: 16 }}>⚠</span>
          <span style={{ color: a.color, fontFamily: "'Space Mono', monospace", fontSize: 11 }}>{a.text}</span>
        </div>
      ))}
    </div>
  );
}

// ───── UNIFIED ACWR BANNER ─────────────────────────────────────────────────
function UnifiedACWRBanner({ unified, matchOnly, trainingOnly, daysSinceMatch }) {
  if (!unified?.acwr) return null;
  const col = acwrColor(unified.acwr);
  return (
    <div style={{ background: `linear-gradient(135deg, ${C.panel}, ${C.panel2})`, border: `2px solid ${col}`, borderRadius: 14, padding: "18px 22px", marginBottom: 20, display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
      <div style={{ width: 56, height: 56, borderRadius: "50%", background: col + "22", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
        <span style={{ color: col, fontSize: 24, fontWeight: 900 }}>{unified.acwr > 1.5 ? "!" : unified.acwr < 0.8 ? "↓" : "✓"}</span>
      </div>
      <div style={{ flex: 1, minWidth: 240 }}>
        <p style={{ color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 3, textTransform: "uppercase" }}>ACWR REAL · Unificado (partidos + entrenos)</p>
        <p style={{ color: col, fontSize: 34, fontWeight: 900, fontFamily: "'Syne', sans-serif", lineHeight: 1, marginTop: 3 }}>
          {unified.acwr} <span style={{ fontSize: 14, fontWeight: 400 }}>{acwrLabel(unified.acwr)}</span>
        </p>
        <p style={{ color: C.dim, fontSize: 10, fontFamily: "'Space Mono', monospace", marginTop: 6 }}>
          7d aguda: {unified.acuteLoad} UA · 28d crónica: {unified.chronicLoad} UA
          {daysSinceMatch != null && ` · ${daysSinceMatch}d desde último partido`}
        </p>
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 12px", minWidth: 110 }}>
          <p style={{ color: C.dim, fontSize: 8, fontFamily: "'Space Mono', monospace", letterSpacing: 2 }}>PARCIAL PARTIDOS</p>
          <p style={{ color: acwrColor(matchOnly), fontSize: 16, fontWeight: 700, fontFamily: "'Syne'" }}>{matchOnly ?? "—"}</p>
        </div>
        <div style={{ background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: "8px 12px", minWidth: 110 }}>
          <p style={{ color: C.dim, fontSize: 8, fontFamily: "'Space Mono', monospace", letterSpacing: 2 }}>PARCIAL TRAINING</p>
          <p style={{ color: acwrColor(trainingOnly), fontSize: 16, fontWeight: 700, fontFamily: "'Syne'" }}>{trainingOnly ?? "—"}</p>
        </div>
      </div>
    </div>
  );
}

function MatchesTab({ matches }) {
  if (!matches?.length) return (
    <div style={{ textAlign: "center", padding: "80px 0", color: C.dim, fontFamily: "'Space Mono', monospace", fontSize: 12 }}>
      Cargando datos desde Google Sheets...<br /><span style={{ color: C.accent }}>Un momento</span>
    </div>
  );

  const avg = key => {
    const v = matches.map(m => m[key]).filter(x => x != null && x > 0);
    return v.length ? +(v.reduce((a, b) => a + b, 0) / v.length).toFixed(2) : null;
  };

  const withACWR = useMemo(() => computeACWR(matches), [matches]);
  const latest = withACWR[withACWR.length - 1];
  const hasHR = matches.some(m => m.z1 > 0 || m.z2 > 0);
  const hasAccel = matches.some(m => m.accel > 0 || m.decel > 0);

  const lrData = withACWR.map(m => ({ date: m.date, actual: m.hid, expected: m.expHID, ratio: m.loadRatio }));

  return (
    <div>
      <AlertBar acwr={latest?.acwr} loadRatio={latest?.loadRatio} scope="Partidos" />
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
        <KPI label="Partidos" value={matches.length} color={C.accent} />
        <KPI label="HID/min avg" value={avg("hidMin")} unit="m/min" color={C.orange} />
        <KPI label="Intensidad avg" value={avg("intensity")} unit="m/min" color={C.accent} />
        <KPI label="ACWR parcial partidos" value={latest?.acwr} color={acwrColor(latest?.acwr)} sub={acwrLabel(latest?.acwr)} />
        <KPI label="Load Ratio (últ)" value={latest?.loadRatio} color={loadRatioColor(latest?.loadRatio)} sub={loadRatioLabel(latest?.loadRatio)} />
      </div>

      <ProgressSection matches={matches} />

      <ST>ACWR PARCIAL — solo partidos (ver banner superior para ACWR REAL)</ST>

        <Badge color={C.amber} label="Underload &lt;0.8" />

// ───── TRAINING FORM — ahora genera línea TAB para pegar en Sheet ─────────
function TrainingLineGenerator() {
  const [f, setF] = useState({
    date: "", weekStart: "", day: "", type: "Training", name: "",
    mins: 70, hid: "", totalDist: "", intensity: "",
    hsr: "", sprints: "", accel: "", decel: "", maxSpeed: "",
    rpe: 6, avgHR: "", maxHR: "",
    z1: "", z2: "", z3: "", z4: "", z5: ""
  });
  const [open, setOpen] = useState(false);
  const [copied, setCopied] = useState(false);

  const field = (key, lbl, type = "number", step = "1") => (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <label style={{ color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 1 }}>{lbl}</label>
      <input type={type} step={step} value={f[key]} onChange={e => setF(p => ({ ...p, [key]: e.target.value }))} />
    </div>
  );

  const genLine = () => {
    const mins = parseFloat(f.mins) || 0;
    const hid = parseFloat(f.hid) || 0;
    const hidMin = mins && hid ? (hid / mins).toFixed(2) : "";
    const z4z5 = (parseFloat(f.z4) || 0) + (parseFloat(f.z5) || 0);
    // Orden WEEKPRACTICE_LOG: A..X
    const cols = [
      f.date, f.weekStart, f.day, f.type, f.name,
      f.mins, f.hid, hidMin, f.totalDist, f.intensity,
      f.hsr, f.sprints, f.accel, f.decel, f.maxSpeed,
      f.rpe, f.avgHR, f.maxHR,
      f.z1, f.z2, f.z3, f.z4, f.z5, z4z5 || ""
    ];
    return cols.map(v => v === null || v === undefined ? "" : String(v)).join("\t");
  };

  const copyLine = () => {
    const line = genLine();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(line).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      });
    }
  };

  return (
    <div style={{ marginBottom: 20 }}>
      <button onClick={() => setOpen(o => !o)} style={{ background: open ? "transparent" : C.accent, color: open ? C.dim : "#000", border: `1px solid ${open ? C.border : C.accent}`, borderRadius: 7, padding: "8px 18px", fontFamily: "'Space Mono', monospace", fontSize: 11, cursor: "pointer" }}>
        {open ? "✕ Cerrar" : "+ Generar línea TAB para WEEKPRACTICE_LOG"}
      </button>
      {open && (
        <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: 20, marginTop: 12 }}>
          <p style={{ color: C.accent, fontFamily: "'Space Mono', monospace", fontSize: 10, marginBottom: 6, letterSpacing: 2 }}>GENERAR LÍNEA PARA SHEET · WEEKPRACTICE_LOG · COLUMNAS A→X</p>
          <p style={{ color: C.dim, fontFamily: "'Space Mono', monospace", fontSize: 9, marginBottom: 14 }}>
            Los entrenamientos viven en el Sheet (fuente única). Llena los campos, copia la línea, pega en la siguiente fila vacía de WEEKPRACTICE_LOG (Ctrl+V en celda A[fila]).
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(130px, 1fr))", gap: 12 }}>
            {field("date", "A · Session Date", "date")}
            {field("weekStart", "B · Week Start", "date")}
            {field("day", "C · Day (Mon/Tue...)", "text")}
            {field("type", "D · Type", "text")}
            {field("name", "E · Name", "text")}
            {field("mins", "F · Minutes")}
            {field("hid", "G · HID")}
            {field("totalDist", "I · Total Dist")}
            {field("intensity", "J · Intensity")}
            {field("hsr", "K · HSR")}
            {field("sprints", "L · Sprints")}
            {field("accel", "M · Accel")}
            {field("decel", "N · Decel")}
            {field("maxSpeed", "O · Max Speed", "number", "0.01")}
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <label style={{ color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 1 }}>P · RPE (1–10)</label>
              <input type="range" min={1} max={10} step="0.5" value={f.rpe} onChange={e => setF(p => ({ ...p, rpe: e.target.value }))} />
              <span style={{ color: C.accent, fontFamily: "'Space Mono', monospace", fontSize: 13, fontWeight: 700 }}>{f.rpe} / 10</span>
            </div>
            {field("avgHR", "Q · Avg HR")}
            {field("maxHR", "R · Max HR")}
            {field("z1", "S · Z1 min")}
            {field("z2", "T · Z2 min")}
            {field("z3", "U · Z3 min")}
            {field("z4", "V · Z4 min")}
            {field("z5", "W · Z5 min")}
          </div>
          <div style={{ marginTop: 18, background: C.bg, border: `1px solid ${C.border}`, borderRadius: 7, padding: "10px 12px" }}>
            <p style={{ color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 2, marginBottom: 6 }}>LÍNEA GENERADA</p>
            <p style={{ color: C.text, fontFamily: "'Space Mono', monospace", fontSize: 10, wordBreak: "break-all" }}>{genLine()}</p>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
            <button onClick={copyLine} style={{ background: copied ? C.green : C.accent, color: "#000", border: "none", borderRadius: 8, padding: "10px 22px", fontFamily: "'Space Mono', monospace", fontSize: 11, cursor: "pointer", fontWeight: 700 }}>
              {copied ? "✓ COPIADO — pega en WEEKPRACTICE_LOG" : "📋 Copiar línea TAB"}
            </button>
            <a href={`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`} target="_blank" rel="noopener" style={{ background: "transparent", color: C.accent, border: `1px solid ${C.accent}`, borderRadius: 8, padding: "10px 22px", fontFamily: "'Space Mono', monospace", fontSize: 11, textDecoration: "none", display: "inline-flex", alignItems: "center" }}>
              Abrir Sheet →
            </a>
          </div>
        </div>
      )}
    </div>
  );
}

// ───── ¿VOY MEJORANDO? — Performance vs Baseline (Mateo vs Mateo) ──────────
function ProgressSection({ matches }) {
  const withAM = useMemo(() => {
    return matches.map((m, i) => {
      const prev = matches.slice(Math.max(0, i - 5), i).filter(p => p.hidMin > 0);
      const prevAvg = prev.length >= 2 ? prev.reduce((s, p) => s + p.hidMin, 0) / prev.length : null;
      const am = prevAvg && m.hidMin > 0 ? +(m.hidMin / prevAvg).toFixed(2) : null;
      return { ...m, baseHIDMin: prevAvg ? +prevAvg.toFixed(2) : null, am };
    });
  }, [matches]);

  const last8 = withAM.filter(m => m.am != null).slice(-8);
  if (last8.length < 3) return null;

  const avgAM = +(last8.reduce((s, m) => s + m.am, 0) / last8.length).toFixed(2);
  const avgPct = Math.round(avgAM * 100);

  const amLabel = (am) => {
    if (am >= 1.20) return { text: "Excelente", color: C.accent };
    if (am >= 1.05) return { text: "Arriba de nivel", color: C.green };
    if (am >= 0.95) return { text: "Normal", color: C.text };
    if (am >= 0.80) return { text: "Debajo de nivel", color: C.amber };
    return { text: "Partido flojo", color: C.red };
  };

  const chartData = last8.map(m => ({
    name: m.date, opponent: m.opponent, result: m.result,
    am: Math.round(m.am * 100), hidMin: m.hidMin, baseHIDMin: m.baseHIDMin,
  }));

  const avgColor = avgAM >= 1.05 ? C.green : avgAM >= 0.95 ? C.text : C.amber;
  const avgMsg = avgAM >= 1.05
    ? `Mateo está jugando ${avgPct - 100}% arriba de su base reciente.`
    : avgAM >= 0.95
    ? `Mateo está jugando a su nivel estándar.`
    : `Mateo está jugando ${100 - avgPct}% debajo de su base reciente.`;

  const ProgressTooltip = ({ active, payload, label }) => {
    if (!active || !payload?.length) return null;
    const d = payload[0]?.payload;
    const lbl = amLabel((d?.am || 100) / 100);
    return (
      <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px 16px" }}>
        <p style={{ color: C.accent, fontWeight: 700, fontSize: 13, margin: "0 0 4px" }}>{label} — {d?.opponent}</p>
        <p style={{ color: lbl.color, fontSize: 12, fontFamily: "'Space Mono', monospace", fontWeight: 700, margin: "0 0 4px" }}>{d?.am}% — {lbl.text}</p>
        <p style={{ color: C.dim, fontSize: 10, fontFamily: "'Space Mono', monospace", margin: "0 0 2px" }}>HID/min actual: {d?.hidMin}</p>
        <p style={{ color: C.dim, fontSize: 10, fontFamily: "'Space Mono', monospace", margin: 0 }}>Base HID/min: {d?.baseHIDMin}</p>
      </div>
    );
  };

  return (
    <div>
      <ST>¿VOY MEJORANDO? — tu rendimiento vs tu propio estándar</ST>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16 }}>
        <div style={{ background: C.panel, border: `2px solid ${avgColor}`, borderRadius: 14, padding: "18px 22px", flex: "1 1 180px", minWidth: 180 }}>
          <p style={{ color: C.dim, fontSize: 8, fontFamily: "'Space Mono', monospace", letterSpacing: 3, textTransform: "uppercase", margin: "0 0 6px" }}>FORMA RECIENTE</p>
          <p style={{ color: avgColor, fontSize: 42, fontWeight: 900, fontFamily: "'Syne', sans-serif", lineHeight: 1, margin: "0 0 6px" }}>{avgPct}%</p>
          <p style={{ color: C.text, fontSize: 11, lineHeight: 1.5, margin: 0 }}>{avgMsg}</p>
        </div>
        <div style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 14, padding: "18px 22px", flex: "2 1 280px", minWidth: 260 }}>
          <p style={{ color: C.accent, fontSize: 10, fontFamily: "'Space Mono', monospace", letterSpacing: 2, textTransform: "uppercase", margin: "0 0 8px" }}>¿QUÉ MIDE ESTO?</p>
          <p style={{ color: C.text, fontSize: 12, lineHeight: 1.6, margin: 0 }}>
            No mide si ganamos o perdimos. Mide si corriste y participaste <strong style={{ color: C.accent }}>por encima o por debajo de tu propio nivel reciente</strong>.
            <br />100% = tu nivel normal. Arriba = estás creciendo. Abajo = tu cuerpo necesita recuperarse.
          </p>
        </div>
      </div>
      <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: "16px 12px 8px", marginBottom: 16 }}>
        <ResponsiveContainer width="100%" height={240}>
          <ComposedChart data={chartData} margin={{ top: 10, right: 20, bottom: 5, left: 0 }}>
            <CartesianGrid stroke={C.muted} strokeDasharray="3 3" />
            <XAxis dataKey="name" tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace" }} />
            <YAxis domain={[60, 160]} tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace" }} label={{ value: "% de tu base", angle: -90, position: "insideLeft", fill: C.dim, fontSize: 9 }} />
            <ReferenceLine y={105} stroke={C.green} strokeDasharray="4 4" strokeOpacity={0.5} />
            <ReferenceLine y={100} stroke={C.text} strokeWidth={2} strokeDasharray="8 4" />
            <ReferenceLine y={95} stroke={C.amber} strokeDasharray="4 4" strokeOpacity={0.5} />
            <Tooltip content={<ProgressTooltip />} />
            <Line type="monotone" dataKey="am" name="Forma %" stroke={C.accent} strokeWidth={3} dot={{ r: 6, fill: C.accent, stroke: C.bg, strokeWidth: 2 }} />
          </ComposedChart>
        </ResponsiveContainer>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(155px, 1fr))", gap: 10, marginBottom: 20 }}>
        {last8.map((m, i) => {
          const lbl = amLabel(m.am);
          const isW = m.result?.startsWith("W");
          return (
            <div key={i} style={{ background: C.panel, border: `1px solid ${lbl.color}33`, borderRadius: 10, padding: "12px 14px" }}>
              <p style={{ color: C.dim, fontSize: 8, fontFamily: "'Space Mono', monospace", letterSpacing: 2, textTransform: "uppercase", margin: "0 0 3px" }}>{m.date}</p>
              <p style={{ color: C.text, fontSize: 11, fontWeight: 700, margin: "0 0 6px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                {m.opponent} <span style={{ color: isW ? C.green : C.red, fontSize: 9 }}>{m.result}</span>
              </p>
              <p style={{ color: lbl.color, fontSize: 24, fontWeight: 900, fontFamily: "'Syne', sans-serif", lineHeight: 1, margin: "0 0 2px" }}>{Math.round(m.am * 100)}%</p>
              <p style={{ color: lbl.color, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 1, margin: "0 0 5px" }}>{lbl.text}</p>
              <p style={{ color: C.dim, fontSize: 8, fontFamily: "'Space Mono', monospace", margin: 0 }}>HID/min {m.hidMin} | Base {m.baseHIDMin}</p>
            </div>
          );
        })}
      </div>
    </div>
  );
}

              <Line key={m} type="monotone" dataKey={m + "Pct"} name={METRIC_INFO[m].label}
                stroke={METRIC_INFO[m].color} strokeWidth={activeMetric === m ? 4 : 2}
                dot={{ r: activeMetric === m ? 6 : 4, fill: METRIC_INFO[m].color }}
                opacity={activeMetric && activeMetric !== m ? 0.25 : 1} />
            ))}
          </LineChart>
        </ResponsiveContainer>
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 20 }}>
        <button onClick={() => setActiveMetric(null)} style={{ background: !activeMetric ? C.accent : "transparent", color: !activeMetric ? "#000" : C.dim, border: `1px solid ${!activeMetric ? C.accent : C.border}`, borderRadius: 6, padding: "5px 12px", fontSize: 10, fontFamily: "'Space Mono', monospace", cursor: "pointer" }}>TODAS</button>
        {metrics.map(m => (
          <button key={m} onClick={() => setActiveMetric(activeMetric === m ? null : m)} style={{ background: activeMetric === m ? METRIC_INFO[m].color : "transparent", color: activeMetric === m ? "#000" : METRIC_INFO[m].color, border: `1px solid ${activeMetric === m ? METRIC_INFO[m].color : C.border}`, borderRadius: 6, padding: "5px 12px", fontSize: 10, fontFamily: "'Space Mono', monospace", cursor: "pointer" }}>
            {METRIC_INFO[m].emoji} {METRIC_INFO[m].label}
          </button>
        ))}
      </div>

      {activeMetric && METRIC_INFO[activeMetric] && (
        <div style={{ background: C.panel2, border: `1px solid ${METRIC_INFO[activeMetric].color}40`, borderRadius: 10, padding: "14px 18px", marginBottom: 16 }}>
          <p style={{ color: METRIC_INFO[activeMetric].color, fontSize: 13, fontWeight: 700, margin: "0 0 6px" }}>{METRIC_INFO[activeMetric].emoji} {METRIC_INFO[activeMetric].label}</p>
          <p style={{ color: C.text, fontSize: 12, lineHeight: 1.6, margin: 0 }}>{METRIC_INFO[activeMetric].tip}</p>
        </div>
      )}

      <ST>DECEL / ACCEL — el indicador que predice lesiones</ST>
      <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: "16px 12px 8px", marginBottom: 16 }}>
        <ResponsiveContainer width="100%" height={200}>
          <ComposedChart data={chartData} margin={{ top: 10, right: 20, bottom: 5, left: 0 }}>
            <CartesianGrid stroke={C.muted} strokeDasharray="3 3" />
            <XAxis dataKey="name" tick={{ fill: C.dim, fontSize: 10, fontFamily: "'Space Mono', monospace" }} />
            <YAxis domain={[0.8, 1.4]} tick={{ fill: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace" }} />
            <ReferenceLine y={1.1} stroke={C.amber} strokeDasharray="5 5" label={{ value: "Zona riesgo 1.1", fill: C.amber, fontSize: 9, fontFamily: "'Space Mono', monospace" }} />
            <ReferenceLine y={1.0} stroke={C.green} strokeDasharray="5 5" label={{ value: "Ideal 1.0", fill: C.green, fontSize: 9, fontFamily: "'Space Mono', monospace" }} />
            <Bar dataKey="decelRatio" name="Decel/Accel" radius={[6, 6, 0, 0]} barSize={36}>
              {chartData.map((d, i) => (
                <Cell key={i} fill={d.decelRatio > 1.15 ? C.red : d.decelRatio > 1.05 ? C.amber : C.green} />
              ))}
            </Bar>
            <Tooltip {...TOOLTIP} formatter={(val) => [val.toFixed(2), "Decel/Accel"]} />
          </ComposedChart>
        </ResponsiveContainer>
        <p style={{ color: C.dim, fontSize: 10, fontFamily: "'Space Mono', monospace", padding: "8px 8px 0", lineHeight: 1.5 }}>
          {METRIC_INFO.decelRatio.tip}
          <br /><span style={{ color: C.green }}>✓ Último partido en 1.02 — zona segura. Tu gemelo se está recuperando.</span>
        </p>
      </div>

      <ST>DETALLE POR PARTIDO</ST>
      <div style={{ overflowX: "auto" }}>
        <table>
          <thead>
            <tr>
              {["#", "Rival", "Fecha", "Score", "G/A", "HID", "HID/min", "Sprints", "Sprint Dist", "HSR", "Work Rate", "Max Speed", "Avg HR", "RPE"].map(h => <th key={h}>{h}</th>)}
            </tr>
          </thead>
          <tbody>
            {MLS_CUP_DATA.map((g, i) => {
              const isW = g.result.startsWith("W");
              return (
                <tr key={i}>
                  <td style={{ color: C.accent }}>{g.game}</td>
                  <td style={{ fontWeight: 700 }}>{g.opponent}</td>
                  <td>{g.date}</td>
                  <td style={{ color: isW ? C.green : C.red, fontWeight: 700 }}>{g.result}</td>
                  <td>{g.goals > 0 ? `⚽${g.goals}` : ""}{g.assists > 0 ? `🅰️${g.assists}` : ""}{g.goals === 0 && g.assists === 0 ? "—" : ""}</td>
                  <td style={{ color: g.hid >= 1000 ? C.green : C.text }}>{g.hid}m</td>
                  <td style={{ color: g.hidMin >= 20 ? C.accent : C.text }}>{g.hidMin}</td>
                  <td style={{ color: g.sprints >= 24 ? C.green : C.text }}>{g.sprints}</td>
                  <td>{g.sprintDist}m</td>
                  <td>{g.hsr}m</td>
                  <td>{g.workRate}%</td>
                  <td>{g.maxSpeed}</td>
                  <td style={{ color: g.avgHR >= 155 ? C.amber : C.text }}>{g.avgHR}</td>
                  <td>{g.rpe}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{ marginTop: 20, background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 10, padding: "14px 18px" }}>
        <p style={{ color: C.accent, fontSize: 10, fontFamily: "'Space Mono', monospace", letterSpacing: 2, textTransform: "uppercase", margin: "0 0 8px" }}>💡 ¿QUÉ SIGNIFICA ESTO PARA TI?</p>
        <p style={{ color: C.text, fontSize: 12, lineHeight: 1.7, margin: 0 }}>
          Llegaste a Salt Lake City con el gemelo lastimado y a 1,300m de altitud — condiciones que hacen que correr sea mucho más difícil.
          En tu primer partido, tu cuerpo produjo solo la mitad de lo normal. Pero <strong style={{ color: C.green }}>partido a partido fuiste subiendo</strong>: tu HID creció 68%, tus sprints se duplicaron, y tu corazón se adaptó (latía menos para hacer más).
          <br /><br />
          <strong style={{ color: C.accent }}>El mensaje clave:</strong> tu cuerpo es capaz de adaptarse rápido — pero necesita tiempo.
          Por eso la recuperación antes de Madrid (Jul 12) es crítica: si llegas sano y preparado, puedes rendir a tu nivel máximo desde el primer partido, no desde el tercero.
        </p>
      </div>
    </div>
  );
}

// ───── Recovery Tab Functions ───────────────────────────────────────────────
function luisReport(matches) {
  if (!matches.length) return "";
  const withACWR = computeACWR(matches);
  const last4 = withACWR.slice(-4);
  const latest = withACWR[withACWR.length - 1];
  const totalLoad = last4.reduce((sum, m) => sum + (m.load || 0), 0);
  const totalMins = last4.reduce((sum, m) => sum + (m.mins || 0), 0);
  const avgHIDMin = last4.reduce((sum, m) => sum + (m.hidMin || 0), 0) / last4.length;
  const decel = last4.reduce((sum, m) => sum + (m.decel || 0), 0);
  const accel = last4.reduce((sum, m) => sum + (m.accel || 0), 0);
  const decelRatio = accel > 0 ? (decel / accel).toFixed(2) : "—";
  const decelRisk = accel > 0 && decel > accel * 1.1 ? "⚠ Decel > Accel — priorizar cadena posterior" : "✓ Decel/Accel balanceado";
  const z45 = last4.reduce((sum, m) => sum + (m.z4 || 0) + (m.z5 || 0), 0);
  const maxSp = Math.max(...last4.map(m => m.maxSpeed || 0));
  const matchList = last4.map(m => `  ${m.date} vs ${m.opponent}: HID/min ${m.hidMin}, RPE ${m.rpe}, Decel ${m.decel}`).join("\n");

  return `Luis · Reporte de carga | ${new Date().toLocaleDateString("es-MX")}

ÚLTIMOS ${last4.length} PARTIDOS (MLS Next Cup):
${matchList}

RESUMEN:
• Carga total: ${totalLoad} UA en ${totalMins} min
• HID/min promedio: ${avgHIDMin.toFixed(1)}
• ACWR actual: ${latest?.acwr?.toFixed(2) ?? "—"} (${latest?.acwr > 1.3 ? "ELEVADO" : latest?.acwr > 0.8 ? "OK" : "bajo"})
• Decel/Accel ratio: ${decelRatio} → ${decelRisk}
• Tiempo Z4+Z5 acumulado: ${z45} min
• Max Speed alcanzada: ${maxSp.toFixed(2)} m/s

PRIORIDADES:
1. Gemelo derecho — evaluar ROM y dolor residual
2. Cadena posterior — isquios + glúteos (carga excéntrica acumulada)
3. Core stability — base para todas las demás

PLAN 6 SEMANAS → MADRID (Jul 12):
→ Jun 1-14: recuperación activa + movilidad
→ Jun 15-28: fuerza funcional progresiva
→ Jun 29-Jul 11: picos de carga + tapering`;
}

  return (

      <ST>PLAN CON LUIS TRUJILLO — Fuerza Funcional</ST>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16 }}>
        <ToolCard title="REPORTE PARA LUIS" icon="💪" body={luisReport(matches)} />
      </div>

      <ST>OBJETIVO: 100% PARA MADRID — Jul 12-19</ST>
      <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: "16px 18px", marginBottom: 16 }}>
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
          {[
            { week: "Jun 1-14", phase: "RECUPERACIÓN", desc: "Movilidad, masaje, calf rehab. Cero impacto. Dormir 9-10h.", color: C.green, pct: "30%" },
            { week: "Jun 15-28", phase: "REACONDICIONAMIENTO", desc: "Fuerza funcional progresiva. Carrera suave. Introducir cambios de dirección.", color: C.amber, pct: "60%" },

          ].map((p, i) => (

      <ReportBlock title="Presoterapia" body="Rhino Performance. 30–45 min. 3x por semana durante fase de recuperación. Calf siempre incluido." />

function ToolCard({ title, icon, body }) {
  const [copied, setCopied] = useState(false);
  const doCopy = () => {
    navigator.clipboard?.writeText(body).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    });
  };
  return (
    <div style={{ flex: 1, minWidth: 280, background: C.panel, border: `1px solid ${C.border}`, borderRadius: 12, padding: "16px 18px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "start", marginBottom: 12 }}>
        <p style={{ color: C.dim, fontSize: 8, fontFamily: "'Space Mono', monospace", letterSpacing: 3, textTransform: "uppercase", margin: 0 }}>{icon} {title}</p>
        <button onClick={doCopy} style={{ background: copied ? C.green : C.accent, color: "#000", border: "none", borderRadius: 4, padding: "4px 10px", fontSize: 9, fontFamily: "'Space Mono', monospace", cursor: "pointer" }}>
          {copied ? "✓" : "📋"}
        </button>
      </div>
      <p style={{ color: C.text, fontSize: 11, fontFamily: "'Space Mono', monospace", whiteSpace: "pre-wrap", lineHeight: 1.5, margin: 0 }}>{body}</p>
    </div>
  );
}

function ReportBlock({ title, body }) {
  return (
    <div style={{ background: C.panel2, border: `1px solid ${C.border}`, borderRadius: 10, padding: "14px 16px", marginBottom: 12 }}>
      <p style={{ color: C.accent, fontSize: 9, fontFamily: "'Space Mono', monospace", letterSpacing: 2, textTransform: "uppercase", marginBottom: 6 }}>{title}</p>
      <p style={{ color: C.text, fontSize: 11, fontFamily: "'Space Mono', monospace", lineHeight: 1.6 }}>{body}</p>
    </div>
  );
}

function SleepBlock() {
  return <ReportBlock title="Sleep Protocol" body="9–10 horas. Cama 21:00. Dark, cool, quiet. Magnesium glycinate 400mg 30min before bed. Avoid blue light 60min pre-sleep." />;
}

function DinnerBlock() {
  return <ReportBlock title="Post-Match Dinner (within 45min)" body="Pollo 200g + Arroz blanco 300g + Verduras (brócoli, zanaoria) 150g. Bebida: Gatorade 500ml. Sin grasa, fácil digestión." />;
}

// ───── DASHBOARD COMPONENT & ROOT RENDER ───────────────────────────────────
function Dashboard() {
  const [data, setData] = useState({ matches: [], training: [], liveMatch: false, liveTraining: false });
  const [tab, setTab] = useState("matches");

  useEffect(() => {
    const tryFetch = async () => {
      try {
        const matchRes = await fetch(csvUrl(MATCH_GID));
        const matchText = await matchRes.text();
        const matchRows = parseCSV(matchText).map(rowToMatch).filter(m => m.opponent);
        const trainingRes = await fetch(csvUrl(TRAINING_GID));
        const trainingText = await trainingRes.text();
        const trainingRows = parseCSV(trainingText).map(rowToTraining).filter(t => t.rawDate);
        setData({
          matches: matchRows.length ? matchRows : MATCH_SEED,
          training: trainingRows.length ? trainingRows : TRAINING_SEED,
          liveMatch: matchRows.length > 0,
          liveTraining: trainingRows.length > 0,
        });
      } catch {
        setData({ matches: MATCH_SEED, training: TRAINING_SEED, liveMatch: false, liveTraining: false });
      }
    };
    tryFetch();
  }, []);

  const allSessions = useMemo(() => [...data.matches, ...data.training], [data]);
  const unifiedACWR = useMemo(() => {
    if (!allSessions.length) return null;
    const withACWR = computeACWR(allSessions);
    return withACWR[withACWR.length - 1];
  }, [allSessions]);

  const matchOnlyACWR = useMemo(() => {
    if (!data.matches.length) return null;
    const withACWR = computeACWR(data.matches);
    return withACWR[withACWR.length - 1]?.acwr;
  }, [data.matches]);

  const trainingOnlyACWR = useMemo(() => {
    if (!data.training.length) return null;
    const withACWR = computeACWR(data.training);
    return withACWR[withACWR.length - 1]?.acwr;
  }, [data.training]);

  const daysSinceLastMatch = useMemo(() => {
    if (!data.matches.length) return null;
    const lastMatch = data.matches[data.matches.length - 1];
    return daysBetween(lastMatch.dateObj, new Date());
  }, [data.matches]);

  return (
    <div style={{ background: C.bg, minHeight: "100vh", padding: "20px 24px", color: C.text, fontFamily: "'Syne', sans-serif" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto" }}>
        <div style={{ marginBottom: 28 }}>
          <h1 style={{ color: C.accent, fontSize: 36, fontFamily: "'Syne', sans-serif", fontWeight: 800, margin: 0, marginBottom: 4 }}>Mateo Favela</h1>
          <p style={{ color: C.dim, fontSize: 11, fontFamily: "'Space Mono', monospace", letterSpacing: 2, textTransform: "uppercase", margin: 0 }}>GPS Performance Tracker · MLS Next SW U14</p>
        </div>

        <UnifiedACWRBanner unified={unifiedACWR} matchOnly={matchOnlyACWR} trainingOnly={trainingOnlyACWR} daysSinceMatch={daysSinceLastMatch} />

        <div style={{ display: "flex", gap: 8, marginBottom: 16, borderBottom: `1px solid ${C.border}`, paddingBottom: 10 }}>
          {[["matches", "MATCHES"], ["playoffs", "🏆 PLAYOFFS"], ["training", "TRAINING"], ["recovery", "RECOVERY"]].map(([key, label]) => (
            <button key={key} onClick={() => setTab(key)} style={{ background: tab === key ? C.accent : "transparent", color: tab === key ? "#000" : C.dim, border: `1px solid ${tab === key ? C.accent : C.border}`, borderRadius: 6, padding: "6px 14px", fontFamily: "'Space Mono', monospace", fontSize: 10, letterSpacing: 1, textTransform: "uppercase", cursor: "pointer" }}>
              {label}
            </button>
          ))}
        </div>

        {tab === "matches" && <MatchesTab matches={data.matches} />}
        {tab === "playoffs" && <PlayoffsTab />}
        {tab === "training" && <TrainingTab sessions={data.training} liveFromSheet={data.liveTraining} />}
        {tab === "recovery" && <RecoveryTab matches={data.matches} />}

        <div style={{ marginTop: 40, paddingTop: 16, borderTop: `1px solid ${C.border}`, color: C.dim, fontSize: 9, fontFamily: "'Space Mono', monospace" }}>
          <p style={{ margin: 0, marginBottom: 8 }}>Dashboard v5 · Google Sheets {data.liveMatch ? "LIVE" : "SEED"} · {new Date().toLocaleDateString("es-MX")}</p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard />);
</script>
</body>
